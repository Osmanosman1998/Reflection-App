<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Team Check</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
  <style>
    :root {
      --bg: #F6F3EE; --card: #FFFFFF; --ink: #1E1A1C; --muted: #5E5459; --line: #D9D0C7;
      --brand: #7A1F3D; --brand-soft: #F3E3E9; --gold: #C9A227; --gold-soft: #FBF3D6;
      --good: #2E7D4F; --good-soft: #DDF0E4; --warn: #9A6B00; --warn-soft: #FBF0D2; --bad: #B03A2E; --bad-soft: #F8E0DC;
      --font: "Atkinson Hyperlegible", Verdana, Arial, sans-serif; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #171315; --card: #221C1F; --ink: #F3EEF0; --muted: #BBAFB4; --line: #3D3337;
        --brand: #E48AA8; --brand-soft: #3A2129; --gold: #E5C55A; --gold-soft: #352C14;
        --good: #7DD3A0; --good-soft: #1D3527; --warn: #F0C55B; --warn-soft: #3A3018; --bad: #F19A8F; --bad-soft: #3D2320;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #171315; --card: #221C1F; --ink: #F3EEF0; --muted: #BBAFB4; --line: #3D3337;
      --brand: #E48AA8; --brand-soft: #3A2129; --gold: #E5C55A; --gold-soft: #352C14;
      --good: #7DD3A0; --good-soft: #1D3527; --warn: #F0C55B; --warn-soft: #3A3018; --bad: #F19A8F; --bad-soft: #3D2320;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 18px/1.45 var(--font); }
    main { max-width: 720px; margin: 0 auto; padding: 16px 16px 48px; }
    h1 { font-size: 26px; margin: 8px 0 4px; color: var(--brand); }
    h2 { font-size: 21px; margin: 0; }
    p { margin: 6px 0; }
    .muted { color: var(--muted); }
    .banner { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .pill { font-size: 15px; padding: 4px 10px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-weight: 700; }
    .pill.done { background: var(--good-soft); color: var(--good); }
    button { font: inherit; cursor: pointer; }
    .btn { background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 18px; font-weight: 700; min-height: 48px; }
    .btn.ghost { background: transparent; color: var(--brand); border: 2px solid var(--brand); }
    .btn:disabled { opacity: .5; cursor: default; }
    .area { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
    .area-title { font-weight: 700; }
    .target { margin: 2px 0 8px; }
    .scores { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .scores button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 8px 2px; font-size: 14px; min-height: 64px; }
    .scores button b { display: block; font-size: 20px; }
    .scores button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); }
    .words { background: var(--bg); border-radius: 10px; padding: 10px 12px; margin: 10px 0 6px; font-style: italic; }
    .seen { display: flex; flex-wrap: wrap; gap: 6px; }
    .seen button { border: 2px solid var(--line); background: var(--card); color: var(--ink); border-radius: 99px; padding: 6px 12px; font-size: 15px; min-height: 40px; }
    .seen button[aria-pressed="true"] { border-color: var(--good); background: var(--good-soft); }
    textarea { width: 100%; font: inherit; border: 2px solid var(--line); border-radius: 10px; padding: 10px; min-height: 80px; background: var(--card); color: var(--ink); }
    .copy { white-space: pre-wrap; background: var(--good-soft); border-radius: 10px; padding: 12px; font-size: 16px; }
    .error { background: var(--bad-soft); color: var(--bad); border-radius: 10px; padding: 10px 12px; }
    .key { font-size: 15px; }
    .tabs { display: flex; gap: 6px; margin: 12px 0 4px; flex-wrap: wrap; }
    .tabs button { flex: 1 1 200px; border: 2px solid var(--brand); background: var(--card); color: var(--brand); border-radius: 12px; padding: 10px 12px; font-weight: 700; min-height: 48px; }
    .tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }
    .label { font-weight: 700; margin: 12px 0 4px; display: block; }
    input[type=text] { width: 100%; font: inherit; border: 2px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card); color: var(--ink); }
    .need { border-color: var(--bad) !important; }
    @media (max-width: 480px) { .scores button { font-size: 12px; } }
  </style>
</head>
<body>
<main id="app"><p class="muted">Loading…</p></main>
<script src="config.js?v=2.0"></script>
<script>
// Team check page, two tabs:
//  1. Project SEARCH team check: one per intern per fortnight (first saved wins)
//  2. Mentor review: once per half term, in the last check only (first saved wins)
// Every target needs a score AND a comment before the check can be saved.
const TYPES = {
  team:   { key: "team",   label: "Project SEARCH team check", saveAs: "Project SEARCH team",
            scale: [[1, "No focus"], [2, "Emerging"], [3, "Partly sustained"], [4, "Mostly sustained"], [5, "Fully sustained"]],
            help: "Score each target and write a comment. Confirm the intern's own words where they wrote some." },
  mentor: { key: "mentor", label: "Mentor review", saveAs: "Mentor or host business",
            scale: [[1, "Not seen yet"], [2, "Once or twice"], [3, "Sometimes"], [4, "Most of the time"], [5, "Every time"]],
            help: "Once at the end of each half term. How often have you seen the intern do each target this half term?" }
};
const SEEN = ["✓ Seen independently", "Seen with prompts", "Partly seen", "Not seen yet"];
const AREAS = CONFIG.areas;
const app = document.getElementById("app");
const code = (new URLSearchParams(location.search).get("t") || "").trim().toLowerCase();
const PREVIEW = !CONFIG.teamUrl;
let data = null;
let tab = "team";

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? "" : v);
  }
  kids.flat().forEach((k) => k != null && e.append(k.nodeType ? k : document.createTextNode(String(k))));
  return e;
}
async function call(url, body, ms = 45000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body), signal: ctl.signal });
    const j = await r.json().catch(() => ({}));
    return { status: r.status, body: j };
  } finally { clearTimeout(t); }
}
const fmt = (d) => { const x = new Date(d); return isNaN(x) ? "" : x.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" }); };
const first = (n) => String(n || "").split(" ")[0];
const isMentorOnly = () => /mentor|host/i.test(data.role || "");
const doneField = (t) => (t === "team" ? "doneBy" : "mentorDoneBy");

// The flow sends the team member plus the rows of the hidden team list table in Excel
function fromFlow(b) {
  if (!b || !b.rows) return b;
  const rows = b.rows.filter((x) => x.Name && x.Active === "Yes");
  return { name: b.name, role: b.role, site: b.site, check: (rows[0] && rows[0].Check) || "", mentorDue: (rows[0] && rows[0].MentorDue) || "", dueBy: (rows[0] && rows[0].DueBy) || "",
    interns: rows.map((x) => ({ internId: x.InternID, name: x.Name, site: x.Site, rotation: x.Rotation === "Not set" ? "" : x.Rotation,
      targets: [x.Target1, x.Target2, x.Target3, x.Target4].map((t) => t || ""),
      words: [x.Words1, x.Words2, x.Words3, x.Words4].map((t) => t || ""),
      doneBy: x.DoneBy || "", mentorDoneBy: x.MentorDoneBy || "", mentor: x.Mentor || "" })) };
}

async function load() {
  if (!code && !PREVIEW) { app.replaceChildren(el("h1", {}, "Team check"), el("p", {}, "Please open this page from your team QR code or link.")); return; }
  if (PREVIEW) { data = demo(); if (isMentorOnly()) tab = "mentor"; return render(); }
  try {
    const r = await call(CONFIG.teamUrl, { token: code });
    if (r.status === 404 || r.status === 403) { app.replaceChildren(el("h1", {}, "Team check"), el("p", {}, "This code is not recognised. Please ask Osman for your link.")); return; }
    data = fromFlow(r.body); if (isMentorOnly()) tab = "mentor"; render();
  } catch (e) {
    app.replaceChildren(el("h1", {}, "Team check"), el("p", { class: "error" }, "Could not connect. Check your internet and try again."), el("button", { class: "btn", onclick: load }, "Try again"));
  }
}

function render() {
  const T = TYPES[tab], f = doneField(tab);
  // Mentor reviews: only in the last check of a half term, and only for interns with a mentor set
  const mentorWait = tab === "mentor" && data.mentorDue === "No";
  const noMentor = (i) => !i.mentor || /not yet set/i.test(i.mentor);
  const pool = tab === "mentor" ? data.interns.filter((i) => !noMentor(i)) : data.interns;
  const todo = mentorWait ? [] : pool.filter((i) => !i[f]), done = pool.filter((i) => i[f]);
  const tabs = isMentorOnly() ? null : el("div", { class: "tabs", role: "tablist" },
    ...Object.values(TYPES).map((x) => el("button", { type: "button", role: "tab", "aria-selected": String(tab === x.key),
      onclick: () => { tab = x.key; render(); } }, x.label)));
  app.replaceChildren(...[
    el("h1", {}, T.label),
    el("p", {}, `Hello ${first(data.name)}. ${data.site === "All sites" ? "All sites" : data.site}.`),
    tabs,
    el("p", { class: "muted" }, T.help),
    data.check ? el("div", { class: "banner" }, el("b", {}, data.check), data.dueBy ? `, due by ${fmt(data.dueBy)}.` : ".",
                    el("p", { class: "key" }, `${done.length} of ${pool.length} interns done. ${tab === "mentor" ? "One per intern each half term" : "One per intern each fortnight"}: the first one saved counts.`))
               : el("div", { class: "banner" }, "No check is due right now (holiday)."),
    mentorWait ? el("p", { class: "muted" }, "Mentor reviews are only needed at the end of each half term. There is nothing to do yet, thank you.") : null,
    PREVIEW ? el("p", { class: "error" }, "Preview: nothing is saved.") : null,
    ...todo.map((i) => card(i, T)),
    done.length ? el("h2", { style: "margin-top:20px" }, "Done") : null,
    ...done.map((i) => el("div", { class: "card row" }, el("span", {}, el("b", {}, i.name)), el("span", { class: "pill done" }, "Done by " + i[f])))
  ].filter(Boolean));
}

function pick(group, value, st, key, n) {
  return (e) => { st[key][n] = value; [...e.currentTarget.parentNode.children].forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget))); };
}

function card(i, T) {
  const st = { scores: {}, seen: {}, comments: {}, reviewer: T.key === "team" ? data.name : "" };
  const box = el("section", { class: "card" });
  const open = el("button", { class: "btn ghost", onclick: () => { open.remove(); box.append(form()); } }, T.key === "team" ? "Start check" : "Start review");
  box.append(el("div", { class: "row" }, el("h2", {}, i.name), el("span", { class: "pill" }, "Due")), el("p", { class: "muted" }, i.rotation || ""), open);

  function form() {
    const f = el("div");
    const fields = [];   // [{n, kind, node}] for the "please fill" check
    if (T.key === "mentor") {
      const who = el("input", { type: "text", placeholder: "Your name and job title", oninput: (e) => (st.reviewer = e.target.value) });
      f.append(el("label", { class: "label" }, "Who is giving this review?"), who);
      fields.push({ kind: "reviewer", node: who });
    }
    AREAS.forEach((a, n) => {
      const t = i.targets[n]; if (!t) return;
      const scores = el("div", { class: "scores", role: "group", "aria-label": "Score" },
        ...T.scale.map(([v, label]) => el("button", { type: "button", "aria-pressed": "false", onclick: pick("s", v, st, "scores", n) }, el("b", {}, v), label)));
      const words = (i.words && i.words[n]) || "";
      const showWords = T.key === "team";
      const comment = el("textarea", { placeholder: T.key === "team" ? "Comment (needed): what did you see?" : "Comment (needed): what did you see the intern do?",
        oninput: (e) => (st.comments[n] = e.target.value) });
      fields.push({ n, kind: "score", node: scores }, { n, kind: "comment", node: comment });
      f.append(el("div", { class: "area" },
        el("div", { class: "area-title" }, `${a.icon} ${a.name}`),
        el("p", { class: "target" }, t),
        scores,
        showWords ? (words ? el("p", { class: "muted", style: "margin-top:10px" }, `${first(i.name)} said they did this:`) : el("p", { class: "muted", style: "margin-top:10px" }, "No words from the intern this fortnight.")) : null,
        showWords && words ? el("div", { class: "words" }, words) : null,
        showWords && words ? el("div", { class: "seen" }, ...SEEN.map((s) => el("button", { type: "button", "aria-pressed": "false", onclick: pick("w", s, st, "seen", n) }, s))) : null,
        el("label", { class: "label" }, "Comment"),
        comment));
    });
    const msg = el("div");
    const save = el("button", { class: "btn", onclick: async () => {
      let missing = 0;
      fields.forEach((x) => {
        const ok = x.kind === "reviewer" ? st.reviewer.trim().length > 2
                 : x.kind === "score" ? !!st.scores[x.n]
                 : (st.comments[x.n] || "").trim().split(/\s+/).filter(Boolean).length >= 3;
        x.node.classList.toggle("need", !ok); if (!ok) missing++;
      });
      if (missing) { msg.replaceChildren(el("p", { class: "error" }, "Please give a score and a comment of at least 3 words for every target" + (T.key === "mentor" ? ", and your name." : "."))); return; }
      save.disabled = true; msg.replaceChildren(el("p", { class: "muted" }, "Saving…"));
      // Recheck just before saving: has someone else already done this intern while this page was open?
      if (!PREVIEW) {
        try {
          const fresh = await call(CONFIG.teamUrl, { token: code }, 15000);
          const row = fresh.status === 200 && fromFlow(fresh.body) && (fromFlow(fresh.body).interns || []).find((x) => x.internId === i.internId);
          const who = row && row[doneField(T.key)];
          if (who) { i[doneField(T.key)] = who; render(); return; }
        } catch (e) { /* no signal for the recheck: carry on and save */ }
      }
      const rec = { token: code, id: [i.internId, data.check, T.key].join(" | "), internId: i.internId, name: i.name, site: i.site || data.site, check: data.check, reviewType: T.saveAs, reviewer: st.reviewer.trim() };
      AREAS.forEach((a, n) => {
        rec["score" + (n + 1)] = st.scores[n] || "";
        rec["comment" + (n + 1)] = (st.comments[n] || "").trim();
        rec["evidence" + (n + 1)] = T.key === "team" ? ((i.words && i.words[n]) || "") : "";
        rec["seen" + (n + 1)] = st.seen[n] || "";
      });
      let r;
      if (PREVIEW) r = { status: 200, body: {} };
      else { try { r = await call(CONFIG.saveCheckUrl, rec); } catch (e) { r = { status: 0 }; } }
      if (r.status === 409) { i[doneField(T.key)] = r.body.doneBy || "someone else"; render(); return; }
      if (r.status !== 200) { save.disabled = false; msg.replaceChildren(el("p", { class: "error" }, "Not saved. Check your internet and press Save again.")); return; }
      i[doneField(T.key)] = rec.reviewer || data.name;
      const text = entry(i, rec, T);
      box.replaceChildren(el("div", { class: "row" }, el("h2", {}, i.name), el("span", { class: "pill done" }, "Saved")),
        el("p", {}, "Copy this into Evidence for Learning (it is also on the Evidence for Learning tab in Excel):"),
        el("div", { class: "copy" }, text),
        el("button", { class: "btn ghost", style: "margin-top:10px", onclick: (e) => { navigator.clipboard && navigator.clipboard.writeText(text); e.target.textContent = "Copied"; } }, "Copy"));
    } }, T.key === "team" ? "Save check" : "Save review");
    f.append(msg, el("div", { style: "margin-top:12px" }, save));
    return f;
  }
  return box;
}

function entry(i, rec, T) {
  // Laid out like an Evidence for Learning comment: Comment, Next Steps, Observed by
  const d = new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });
  const by = T.key === "team" ? `${rec.reviewer} (Project SEARCH team)` : `${rec.reviewer} (mentor)`;
  let s = `${i.name}, ${d}`;
  AREAS.forEach((a, n) => {
    if (!i.targets[n]) return;
    const ev = rec["evidence" + (n + 1)], seen = rec["seen" + (n + 1)], sc = rec["score" + (n + 1)];
    const label = (T.scale.find((x) => x[0] === sc) || [, ""])[1];
    const level = { 1: "FS", 2: "PS", 3: "MI", 4: "I", 5: "I" }[sc] || "";
    const c = rec["comment" + (n + 1)]; const cm = /[.!?]$/.test(c) ? c : c + ".";
    s += `\n\n${a.name}: ${i.targets[n]}\nScore: ${sc} out of 5 (${label}). Level of support: ${level}\nComment: ${cm}`;
    if (ev) s += ` Intern's words: '${ev}' (${seen || "not confirmed"}).`;
    s += `\nObserved by: ${by}`;
  });
  return s;
}

function demo() {
  return { name: "Helen Gillan", role: "Site lead", site: "QMUL", check: "Autumn 2 2026, check 1", dueBy: new Date(Date.now() + 5 * 864e5).toISOString(),
    interns: [
      { internId: "PS001", name: "Alex (example)", rotation: "Post room", targets: ["Ask for help when I am stuck at work", "Travel to placement on my own", "Drink water and eat lunch at break", "Say good morning to my team"],
        words: ["I asked when I was not sure where a letter went", "I travelled on my own", "", "I said good morning to my team"] },
      { internId: "PS004", name: "Priya (example)", rotation: "Library", targets: ["Follow a three step instruction", "", "", ""], words: ["", "", "", ""], mentorDoneBy: "Sam Lee (Library supervisor)" },
      { internId: "PS002", name: "Jordan (example)", doneBy: "Arthur Davis", targets: [] }
    ] };
}
load();
</script>
</body>
</html>
